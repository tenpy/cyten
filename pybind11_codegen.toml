# config file for https://github.com/tenpy/pybind11_codegen/, added as submodule in .cursor/skills/
[clang]
parse_args = ["-x", "c++", "--driver-mode=g++", "-v", "--std=c++23",
  "-I/usr/lib/clang/21/include/",
  "-I/opt/micromamba/envs/cyten_py314/include/python3.14",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/include",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/src",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/pybind",
]
library_path = "/usr/lib64"
# library_file = "/usr/lib64/libclang.so.21.4"

[paths]
load_python = "cyten/**/*.py"
load_cpp_include = "include/**/*.h"
templates = ".cursor/skills/pybind11-codegen/assets"

[types_py_to_cpp]
int = "int64"
float = "float64"
complex = "complex128"
"npt.NDArray[float]" = "xt::xarray<float64>"
Block = "BlockBackend::BlockPtr"
"dict[str, int]" = "std::map<std::string, int64>"
"list[BigOMonomial]" = "std::set<BigOMonomial>"
"set[BigOMonomial]" = "std::set<BigOMonomial>"
Sector = "Sector"
SectorArray = "SectorArray"
FusionStyle = "FusionStyle"
BraidingStyle = "BraidingStyle"
SymmetryError = "SymmetryError"
Symmetry = "Symmetry::Ptr"
FusionTree = "FusionTree"
"dict[FusionTree, float | complex]" = "FusionTreeLinearCombination"
"dict[FusionTree, complex]" = "FusionTreeLinearCombination"
"dict[tuple[FusionTree, FusionTree], float | complex]" = "FusionTreePairLinearCombination"
Dtype = "Dtype"
Leg = "Leg::Ptr"
Space = "Space::Ptr"
"list[ElementarySpace]" = "std::vector<Leg::Ptr>"
"list[Leg]" = "std::vector<Leg::Ptr>"
"ndarray | None" = "std::optional<std::vector<int64>>"
"Sequence[int] | None" = "std::optional<std::vector<int64>>"
"SectorArray | Sequence[Sequence[int]]" = "SectorArray"
"Literal['sorted'] | Literal['dual_sorted'] | None" = "std::optional<std::string>"
"callable" = "SectorMapFn"
BlockBackend = "std::shared_ptr<BlockBackend>"
TensorBackend = "TensorBackend::Ptr"
Data = "TensorBackend::DataPtr"
DiagonalData = "TensorBackend::DataPtr"
MaskData = "TensorBackend::DataPtr"
SymmetricTensor = "SymmetricTensor::Ptr"
DiagonalTensor = "DiagonalTensor::Ptr"
Identity = "Identity::Ptr"
Mask = "Mask::Ptr"
ChargedTensor = "ChargedTensor::Ptr"
ElementarySpace = "ElementarySpace::Ptr"
LegPipe = "LegPipe::Ptr"
TensorProduct = "TensorProduct::Ptr"
"list[LegPipe]" = "std::vector<LegPipe::Ptr>"
"list[list[int]]" = "std::vector<std::vector<int64>>"
"list[tuple[int, int]]" = "std::vector<std::pair<int64, int64>>"
"list[int | None]" = "std::vector<std::optional<int64>>"
"list[bool | None]" = "std::vector<std::optional<bool>>"
"list[str | None]" = "std::vector<std::optional<std::string>>"
"str | None" = "std::optional<std::string>"
"dict[str, str]" = "std::map<std::string, std::string>"
Tensor = "Tensor::Ptr"
LabelledLegs = "LabelledLegs"
"float | complex | BlockBackend.Scalar" = "BlockBackend::Scalar"
"dict[tuple[FusionTree, FusionTree], Block]" = "std::map<std::pair<FusionTree, FusionTree>, BlockBackend::BlockPtr>"
