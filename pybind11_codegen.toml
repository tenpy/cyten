# config file for https://github.com/tenpy/pybind11_codegen/, added as submodule in .cursor/skills/
[clang]
parse_args = ["-x", "c++", "--driver-mode=g++", "-v", "--std=c++23",
  "-I/usr/lib/clang/21/include/",
  "-I/opt/micromamba/envs/cyten_py314/include/python3.14",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/include",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/src",
  "-I/home/johannes/sync/Nextcloud/nc.tnqf-jh.duckdns.org/work/tenpy/cyten_cpp/pybind",
]
library_path = "/usr/lib64"
# library_file = "/usr/lib64/libclang.so.21.4"

[paths]
load_python = "cyten/**/*.py"
load_cpp_include = "include/**/*.h"
templates = ".cursor/skills/pybind11-codegen/assets"

[types_py_to_cpp]
int = "int64"
float = "float64"
complex = "complex128"
"npt.NDArray[float]" = "xt::xarray<float64>"
Block = "BlockPtr"
"dict[str, int]" = "std::map<std::string, int64>"
"list[BigOMonomial]" = "std::set<BigOMonomial>"
"set[BigOMonomial]" = "std::set<BigOMonomial>"
Sector = "Sector"
SectorArray = "SectorArray"
FusionStyle = "FusionStyle"
BraidingStyle = "BraidingStyle"
SymmetryError = "SymmetryError"
