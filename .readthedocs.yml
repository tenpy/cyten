# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Miniforge provides conda/mamba. The Python version comes from docs/environment.yml.
    python: "miniforge3-26.3"
  jobs:
    post_install:
      # Isolated pip would pull a CUDA PyTorch wheel; CMake must see conda-forge pytorch.
      - pip install --verbose --no-build-isolation .
    pre_build:
      # Breathe reads Doxygen XML from docs/build_docs/doxy_xml
      - cd docs && doxygen

sphinx:
  configuration: docs/conf.py

conda:
  environment: docs/environment.yml
