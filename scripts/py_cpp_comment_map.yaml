# Python → C++ / pybind mapping for layers 2–4.
# Paths under `py:` are relative to tmp/orig_lasyten/.
# Paths under cpp/pybind are relative to the repo root.
#
# Derived from docs/cpp_conversion/convert_*.md metadata (path fields only).

modules:
  # --- Layer 3: backends ---
  - py: backends/_backend.py
    cpp:
      - src/backends/tensor_backend.cpp
      - include/lasyten/backends/tensor_backend.h
    pybind:
      - pybind/backends/py_tensor_backend.cpp

  - py: backends/no_symmetry.py
    cpp:
      - src/backends/no_symmetry.cpp
      - include/lasyten/backends/no_symmetry.h
    pybind:
      - pybind/backends/py_no_symmetry.cpp

  - py: backends/abelian.py
    cpp:
      - src/backends/abelian.cpp
      - include/lasyten/backends/abelian.h
      - src/backends/block_inds.cpp
      - include/lasyten/backends/block_inds.h
    pybind:
      - pybind/backends/py_abelian.cpp
      - pybind/backends/py_block_inds.cpp

  - py: backends/fusion_tree_backend.py
    cpp:
      - src/backends/fusion_tree_backend.cpp
      - include/lasyten/backends/fusion_tree_backend.h
      - src/backends/fusion_tree_mapping.cpp
      - include/lasyten/backends/fusion_tree_mapping.h
      - src/backends/fusion_tree_permute.cpp
      - include/lasyten/backends/fusion_tree_permute.h
    pybind:
      - pybind/backends/py_fusion_tree_backend.cpp
      - pybind/backends/py_fusion_tree_mapping.cpp

  - py: backends/backend_factory.py
    cpp:
      - src/backends/backend_factory.cpp
      - include/lasyten/backends/backend_factory.h
    pybind:
      - pybind/backends/py_backend_factory.cpp

  # --- Layer 2: spaces / trees ---
  - py: symmetries/spaces.py
    cpp:
      - src/symmetries/spaces.cpp
      - include/lasyten/symmetries/spaces.h
    pybind:
      - pybind/symmetries/py_spaces.cpp

  - py: symmetries/trees.py
    cpp:
      - src/symmetries/trees.cpp
      - include/lasyten/symmetries/trees.h
    pybind:
      - pybind/symmetries/py_trees.cpp

  # --- Layer 2: _symmetries.py (split across many C++ units) ---
  - py: symmetries/_symmetries.py
    cpp:
      - src/symmetries/base_symmetry.cpp
      - include/lasyten/symmetries/base_symmetry.h
      - src/symmetries/symmetry_factor.cpp
      - include/lasyten/symmetries/symmetry_factor.h
      - src/symmetries/group.cpp
      - include/lasyten/symmetries/group.h
      - src/symmetries/abelian_group.cpp
      - include/lasyten/symmetries/abelian_group.h
      - src/symmetries/symmetry.cpp
      - include/lasyten/symmetries/symmetry.h
      - src/symmetries/fusion_symbol.cpp
      - include/lasyten/symmetries/fusion_symbol.h
      - include/lasyten/symmetries/exceptions.h
      - include/lasyten/symmetries/styles.h
      - include/lasyten/symmetries/sector.h
      - src/symmetries/sector_array.cpp
      - include/lasyten/symmetries/topo_ones.h
      - src/symmetries/factors/no_symmetry.cpp
      - include/lasyten/symmetries/factors/no_symmetry.h
      - src/symmetries/factors/u1.cpp
      - include/lasyten/symmetries/factors/u1.h
      - src/symmetries/factors/zn.cpp
      - include/lasyten/symmetries/factors/zn.h
      - src/symmetries/factors/su2.cpp
      - include/lasyten/symmetries/factors/su2.h
      - src/symmetries/factors/sun.cpp
      - include/lasyten/symmetries/factors/sun.h
      - src/symmetries/factors/fermion_number.cpp
      - include/lasyten/symmetries/factors/fermion_number.h
      - src/symmetries/factors/fermion_parity.cpp
      - include/lasyten/symmetries/factors/fermion_parity.h
      - src/symmetries/factors/zn_anyon_category.cpp
      - include/lasyten/symmetries/factors/zn_anyon_category.h
      - src/symmetries/factors/zn_anyon_category2.cpp
      - include/lasyten/symmetries/factors/zn_anyon_category2.h
      - src/symmetries/factors/quantum_double_zn_anyon_category.cpp
      - include/lasyten/symmetries/factors/quantum_double_zn_anyon_category.h
      - src/symmetries/factors/toric_code_category.cpp
      - include/lasyten/symmetries/factors/toric_code_category.h
      - src/symmetries/factors/fibonacci_anyon_category.cpp
      - include/lasyten/symmetries/factors/fibonacci_anyon_category.h
      - src/symmetries/factors/ising_anyon_category.cpp
      - include/lasyten/symmetries/factors/ising_anyon_category.h
      - src/symmetries/factors/su2_k_anyon_category.cpp
      - include/lasyten/symmetries/factors/su2_k_anyon_category.h
      - src/symmetries/factors/su3_3_anyon_category.cpp
      - include/lasyten/symmetries/factors/su3_3_anyon_category.h
    pybind:
      - pybind/symmetries/py_base_symmetry.cpp
      - pybind/symmetries/py_symmetry_factor.cpp
