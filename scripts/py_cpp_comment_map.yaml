      - pybind/symmetries/factors/py_u1.cpp
      - pybind/symmetries/factors/py_zn.cpp
      - pybind/symmetries/factors/py_su2.cpp
      - pybind/symmetries/factors/py_sun.cpp
      - pybind/symmetries/factors/py_fermion_number.cpp
      - pybind/symmetries/factors/py_fermion_parity.cpp
      - pybind/symmetries/factors/py_zn_anyon_category.cpp
      - pybind/symmetries/factors/py_zn_anyon_category2.cpp
      - pybind/symmetries/factors/py_quantum_double_zn_anyon_category.cpp
      - pybind/symmetries/factors/py_toric_code_category.cpp
      - pybind/symmetries/factors/py_fibonacci_anyon_category.cpp
      - pybind/symmetries/factors/py_ising_anyon_category.cpp
      - pybind/symmetries/factors/py_su2_k_anyon_category.cpp
