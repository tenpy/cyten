name: cyten-docs
channels:
  - conda-forge
dependencies:
  - python>=3.14
  - pip
  - setuptools>=68.0.0
  - setuptools-scm
  - numpy>=2.0
  - scipy
  - doxygen  # Breathe C++ API + DOC() map for _core stubs
  # Testing not required for docs; keep sympy out to slim the env

  # building Sphinx docs
  - sphinx
  - sphinx_rtd_theme
  - graphviz
  - sphinx-copybutton

  # I/O (optional imports in the Python package)
  - hdf5
  - h5py
  - pyyaml
  - toml

  # pip last: packages after a `pip:` block are ignored by conda
  - pip:
    - breathe  # conda-forge version seems incompatible
