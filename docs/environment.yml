name: cyten
channels:
  - conda-forge
dependencies:
  - python>=3.14
  - pip
  - setuptools>=68.0.0
  - pybind11>=3.0
  - scikit-build-core
  - setuptools-scm
  - numpy>=2.0
  - scipy
  - openblas
  - cmake
  - compilers  # C/C++ toolchain to build the pybind11 extension (e.g. on Read the Docs)
  - doxygen  # required: generates pybind/docstrings/ DOC() headers at build time
  - pytorch
  # alteratively use MKL instead of openblas
  # - mkl
  # - mkl-devel
  # - libblas=*=*mkl  # pin BLAS to use MKL
  # Testing
  - pytest>=6.0
  - sympy

  # developer tools
  - ipython
  - ruff
  - flake8
  - flake8-rst-docstrings
  - sphinx-lint

  # building Sphinx docs
  - sphinx
  - sphinx_rtd_theme
  - graphviz
  - sphinx-copybutton

  # I/O
  - hdf5
  - h5py
  - pyyaml
  - toml

  # pip last: packages after a `pip:` block are ignored by conda
  - pip:
    - breathe  # conda-forge version seems incompatible
