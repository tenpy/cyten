name: Run Pytest (torch)
# Run the test suite using pytest

on:
  # pushes to main
  push:
    branches:
      - main
  # PRs
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  build:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    env:
      # make pytest output in color
      PY_COLORS: 1
    defaults:
      run:
        # needed so micromamba activation from setup-micromamba takes effect
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # external/hdf5_io: CMake (CYTEN_WITH_HDF5) and the Python hdf5_io package
        submodules: true

    - name: Set up micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        cache-environment: true

    - name: Build and install
      # build deps (pybind11, scikit-build-core, cmake, ...) come from environment.yml
      # hdf5_io is not on PyPI yet; install the git submodule (needed for cyten.tools.hdf5_io)
      run: |
        pip install --no-build-isolation -e ./external/hdf5_io
        pip install --no-build-isolation -e .

    - name: Run pytest
      # configuration in pyproject.toml
      # Note: This runs in the repo root directory, which contains the cyten source folder.
      #       To use the version we just installed, it is important to run `pytest`
      #       instead of `python -m pytest`.
      run: pytest --block-backends "torch"
